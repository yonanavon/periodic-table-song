<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הטבלה המחזורית</title>
<style>
  :root{
    --bg:#f3eecf; --ink:#1d3b47; --muted:#5f6f75; --card:#fffdf3;
    --alkali:#ef4d6a; --alkaline:#f7a48c; --transition:#f2b9a6; --post:#7fbf93;
    --metalloid:#9fd3b0; --nonmetal:#f0e79a; --halogen:#e9dc6b; --noble:#2f6f7e;
    --lanth:#a46bc0; --act:#e57399; --unknown:#c9c4b4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px 4px}
  h1{margin:0;font-size:clamp(20px,3vw,32px)}
  .sub{color:var(--muted);font-size:14px;margin:2px 0 0}
  .player{display:flex;gap:8px;align-items:center}
  button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:8px 16px;background:var(--ink);color:#fff}
  button.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  input[type=range]{accent-color:var(--ink);width:110px}

  .wrap{overflow-x:auto;padding:12px 16px 24px}
  .table{direction:ltr;display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));gap:4px;min-width:860px;max-width:1500px;margin:0 auto}
  .gap{grid-column:1/-1;height:10px}
  .el{position:relative;aspect-ratio:1/1.12;border-radius:6px;border:1px solid rgba(0,0,0,.15);background:var(--c);
      color:#16303a;padding:3px 4px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
      transition:transform .12s, box-shadow .12s;overflow:hidden}
  .el:hover,.el:focus-visible{transform:scale(1.18);z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.25);outline:none}
  .el .n{font-size:10px;opacity:.75}
  .el .s{font-weight:800;font-size:clamp(14px,1.6vw,22px);text-align:center;line-height:1}
  .el .h{font-size:9px;text-align:center;direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .el.dark{color:#fff}
  .el.playing{outline:3px solid var(--ink);outline-offset:1px}
  .ph{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;padding:0 16px 24px;font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;background:var(--c);border:1px solid rgba(0,0,0,.15)}

  dialog{border:0;border-radius:16px;padding:0;max-width:min(960px,94vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(20,30,35,.65)}
  dialog img{display:block;width:100%;height:auto;border-radius:16px 16px 0 0;background:#000}
  .info{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px}
  .info h2{margin:0;font-size:24px}
  .info .meta{color:var(--muted);font-size:14px}
  .nav{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>הטבלה המחזורית של שיר היסודות</h1>
    <p class="sub">לחצו על יסוד כדי לראות את התמונה שלו מתוך הסרטון. הפסקול מתנגן ברקע.</p>
  </div>
  <div class="player">
    <button id="playBtn">▶ נגן פסקול</button>
    <label title="עוצמה">🔊 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6"></label>
  </div>
</header>

<div class="wrap"><div class="table" id="table"></div></div>
<div class="legend" id="legend"></div>

<dialog id="dlg">
  <img id="dImg" alt="">
  <div class="info">
    <div>
      <h2 id="dTitle"></h2>
      <div class="meta" id="dMeta"></div>
    </div>
    <div class="nav">
      <button class="ghost" id="prev">→ הקודם</button>
      <button class="ghost" id="jump">♪ שמע את הרגע בשיר</button>
      <button class="ghost" id="next">הבא ←</button>
      <button class="ghost" id="follow">⏸ עצור מעקב אחרי השיר</button>
      <button id="close">סגור</button>
    </div>
  </div>
</dialog>

<audio id="audio" src="media/soundtrack.mp3" loop preload="auto"></audio>

<script>
// [symbol, Hebrew name, category]
const E = [
 ["H","מימן","nonmetal"],["He","הליום","noble"],["Li","ליתיום","alkali"],["Be","בריליום","alkaline"],
 ["B","בור","metalloid"],["C","פחמן","nonmetal"],["N","חנקן","nonmetal"],["O","חמצן","nonmetal"],
 ["F","פלואור","halogen"],["Ne","ניאון","noble"],["Na","נתרן","alkali"],["Mg","מגנזיום","alkaline"],
 ["Al","אלומיניום","post"],["Si","צורן","metalloid"],["P","זרחן","nonmetal"],["S","גופרית","nonmetal"],
 ["Cl","כלור","halogen"],["Ar","ארגון","noble"],["K","אשלגן","alkali"],["Ca","סידן","alkaline"],
 ["Sc","סקנדיום","transition"],["Ti","טיטניום","transition"],["V","ונדיום","transition"],["Cr","כרום","transition"],
 ["Mn","מנגן","transition"],["Fe","ברזל","transition"],["Co","קובלט","transition"],["Ni","ניקל","transition"],
 ["Cu","נחושת","transition"],["Zn","אבץ","transition"],["Ga","גליום","post"],["Ge","גרמניום","metalloid"],
 ["As","ארסן","metalloid"],["Se","סלניום","nonmetal"],["Br","ברום","halogen"],["Kr","קריפטון","noble"],
 ["Rb","רובידיום","alkali"],["Sr","סטרונציום","alkaline"],["Y","איטריום","transition"],["Zr","זירקוניום","transition"],
 ["Nb","ניוביום","transition"],["Mo","מוליבדן","transition"],["Tc","טכנציום","transition"],["Ru","רותניום","transition"],
 ["Rh","רודיום","transition"],["Pd","פלדיום","transition"],["Ag","כסף","transition"],["Cd","קדמיום","transition"],
 ["In","אינדיום","post"],["Sn","בדיל","post"],["Sb","אנטימון","metalloid"],["Te","טלוריום","metalloid"],
 ["I","יוד","halogen"],["Xe","קסנון","noble"],["Cs","צזיום","alkali"],["Ba","בריום","alkaline"],
 ["La","לנתן","lanth"],["Ce","צריום","lanth"],["Pr","פרסאודימיום","lanth"],["Nd","ניאודימיום","lanth"],
 ["Pm","פרומתיום","lanth"],["Sm","סמריום","lanth"],["Eu","אירופיום","lanth"],["Gd","גדוליניום","lanth"],
 ["Tb","טרביום","lanth"],["Dy","דיספרוסיום","lanth"],["Ho","הולמיום","lanth"],["Er","ארביום","lanth"],
 ["Tm","תוליום","lanth"],["Yb","איטרביום","lanth"],["Lu","לוטציום","lanth"],["Hf","הפניום","transition"],
 ["Ta","טנטלום","transition"],["W","טונגסטן","transition"],["Re","רניום","transition"],["Os","אוסמיום","transition"],
 ["Ir","אירידיום","transition"],["Pt","פלטינה","transition"],["Au","זהב","transition"],["Hg","כספית","transition"],
 ["Tl","תליום","post"],["Pb","עופרת","post"],["Bi","ביסמוט","post"],["Po","פולוניום","post"],
 ["At","אסטטין","halogen"],["Rn","ראדון","noble"],["Fr","פרנציום","alkali"],["Ra","רדיום","alkaline"],
 ["Ac","אקטיניום","act"],["Th","תוריום","act"],["Pa","פרוטקטיניום","act"],["U","אורניום","act"],
 ["Np","נפטוניום","act"],["Pu","פלוטוניום","act"],["Am","אמריקיום","act"],["Cm","קיריום","act"],
 ["Bk","ברקליום","act"],["Cf","קליפורניום","act"],["Es","איינשטייניום","act"],["Fm","פרמיום","act"],
 ["Md","מנדלביום","act"],["No","נובליום","act"],["Lr","לורנציום","act"],["Rf","רתרפורדיום","transition"],
 ["Db","דובניום","transition"],["Sg","סיבורגיום","transition"],["Bh","בוהריום","transition"],["Hs","האסיום","transition"],
 ["Mt","מייטנריום","unknown"],["Ds","דרמשטטיום","unknown"],["Rg","רנטגניום","unknown"],["Cn","קופרניקיום","transition"],
 ["Nh","ניהוניום","unknown"],["Fl","פלרוביום","unknown"],["Mc","מוסקוביום","unknown"],["Lv","ליברמוריום","unknown"],
 ["Ts","טנסין","unknown"],["Og","אוגנסון","unknown"]
];

// Start time (seconds) of each element's moment in the song
const T = [16.48,17.04,17.4,18.24,19.16,19.84,20.4,20.76,21.68,23.32,23.64,24.04,25,25.72,26.56,26.96,27.32,27.64,28.04,28.8,
 30.04,30.8,31.68,32.64,33.32,33.76,34.16,35.04,36.76,37.4,57.8,58.32,58.92,59.6,60.56,61.44,61.92,63.04,63.96,64.72,
 65.68,66.6,67.28,68.12,69.24,69.8,70.52,71.8,72.48,73.16,73.6,74.12,74.64,75.08,75.68,76.04,76.68,77.16,78.16,79.16,
 99.44,100.2,101.08,101.52,102.68,102.96,104.04,104.68,105.56,106.08,106.92,107.76,108.56,109.04,109.44,110.16,110.88,111.68,112.36,112.72,
 113.16,113.48,114.84,115.32,116.24,116.72,117.12,117.68,118.12,118.64,137.88,138.72,139.6,140.12,141.04,141.68,142.32,142.92,143.84,144.56,
 145.16,145.96,146.8,147.36,148.4,149,149.96,150.6,151.44,151.88,152.76,153.36,154.28,154.96,155.88,156.48,157.36,158.04];

const CAT = {
  alkali:["מתכות אלקליות",1], alkaline:["מתכות אלקליות עפרוריות",0], transition:["מתכות מעבר",0],
  post:["מתכות אחרות",0], metalloid:["מתכות למחצה",0], nonmetal:["אל-מתכות",0], halogen:["הלוגנים",0],
  noble:["גזים אצילים",1], lanth:["לנתנידים",1], act:["אקטינידים",0], unknown:["תכונות לא ידועות",0]
};

function pos(z){ // [row, col] in an 18-column grid; rows 9-10 hold the f-block
  if(z===1) return [1,1]; if(z===2) return [1,18];
  if(z<=10) return [2, z<=4 ? z-2 : z+8];
  if(z<=18) return [3, z<=12 ? z-10 : z];
  if(z<=36) return [4, z-18];
  if(z<=54) return [5, z-36];
  if(z>=57&&z<=71) return [9, z-54];
  if(z>=89&&z<=103) return [10, z-86];
  if(z<=56) return [6, z-54];
  if(z<=86) return [6, z-68];
  if(z<=88) return [7, z-86];
  return [7, z-100];
}

const table = document.getElementById('table');
const cells = [];
E.forEach(([sym,name,cat],i)=>{
  const z=i+1, [r,c]=pos(z), d=document.createElement('div');
  d.className='el'+(CAT[cat][1]?' dark':''); d.tabIndex=0;
  d.style.setProperty('--c',`var(--${cat})`);
  d.style.gridRow = r>=9 ? r+0 : r; d.style.gridColumn=c;
  d.innerHTML=`<span class="n">${z}</span><span class="s">${sym}</span><span class="h">${name}</span>`;
  d.title=`${z} · ${sym} · ${name}`;
  d.onclick=()=>open(z);
  d.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open(z);} };
  table.appendChild(d); cells[z]=d;
});
// spacer row between main table and f-block, plus placeholders for La/Ac series
const g=document.createElement('div'); g.className='gap'; g.style.gridRow=8; table.appendChild(g);
[[6,'57–71'],[7,'89–103']].forEach(([r,t])=>{const p=document.createElement('div');p.className='ph';p.style.gridRow=r;p.style.gridColumn=3;p.textContent=t;table.appendChild(p);});

const legend=document.getElementById('legend');
Object.entries(CAT).forEach(([k,[l]])=>{legend.insertAdjacentHTML('beforeend',`<span style="--c:var(--${k})"><i></i>${l}</span>`)});

// Audio
const dlg=document.getElementById('dlg'); let curZ=1;
const audio=document.getElementById('audio'), playBtn=document.getElementById('playBtn'), vol=document.getElementById('vol');
audio.volume=+vol.value; vol.oninput=()=>audio.volume=+vol.value;
const setBtn=()=>playBtn.textContent=audio.paused?'▶ נגן פסקול':'⏸ השהה פסקול';
playBtn.onclick=()=>{ audio.paused?audio.play():audio.pause(); };
audio.onplay=audio.onpause=setBtn;
// Browsers block autoplay until the first interaction, so start the music on the first click anywhere
document.addEventListener('pointerdown',function first(){ if(audio.paused&&!audio.dataset.touched) audio.play().catch(()=>{}); audio.dataset.touched=1; document.removeEventListener('pointerdown',first); },{once:true});
// Element being sung at time t (0 = none)
function sungAt(t){
  for(let z=1;z<=118;z++){ const end = z<118 ? Math.min(T[z], T[z-1]+3) : T[z-1]+2.4; if(t>=T[z-1]&&t<end) return z; }
  return 0;
}
// rAF instead of timeupdate: timeupdate fires only ~4x/sec, too coarse for elements lasting ~0.3s
let lastSung=-1, follow=true;
(function tick(){
  if(!audio.paused){
    const cur=sungAt(audio.currentTime);
    if(cur!==lastSung){
      lastSung=cur;
      cells.forEach((c,z)=>c&&c.classList.toggle('playing',z===cur));
      if(cur && follow && dlg.open && cur!==curZ) show(cur);
    }
  }
  requestAnimationFrame(tick);
})();

// Dialog
const followBtn=document.getElementById('follow');
function setFollow(on){
  follow=on; followBtn.textContent=on?'⏸ עצור מעקב אחרי השיר':'▶ המשך מעקב אחרי השיר';
  lastSung=-1; // re-sync immediately on resume
}
followBtn.onclick=()=>setFollow(!follow);
function open(z){ show(z); }
function show(z){
  curZ=z; const [sym,name,cat]=E[z-1];
  document.getElementById('dImg').src=`images/${String(z).padStart(3,'0')}.jpg`;
  document.getElementById('dImg').alt=`${name} (${sym})`;
  document.getElementById('dTitle').textContent=`${name} · ${sym}`;
  document.getElementById('dMeta').textContent=`מספר אטומי ${z} · ${CAT[cat][0]}`;
  if(!dlg.open) dlg.showModal();
}
// Manual navigation pauses song-following, otherwise the song would immediately override it
const step=d=>{ if(follow&&!audio.paused) setFollow(false); show(((curZ-1+d+118)%118)+1); };
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('jump').onclick=()=>{ setFollow(true); audio.currentTime=Math.max(0,T[curZ-1]-0.3); audio.play().catch(()=>{}); };
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
document.addEventListener('keydown',e=>{
  if(!dlg.open) return;
  if(e.key==='ArrowLeft') step(1);
  if(e.key==='ArrowRight') step(-1);
});
</script>
</body>
</html>
